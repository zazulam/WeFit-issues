name: ✨ Feature Request
description: Suggest a new feature or enhancement for WeFit
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion! We appreciate your input on how to improve WeFit.
        
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
      
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see
      placeholder: Describe your ideal solution...
    validations:
      required: true
      
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or features?
      placeholder: Describe alternatives you've considered...
    validations:
      required: false
      
  - type: dropdown
    id: platform
    attributes:
      label: Which platform would this feature be for?
      description: Select all that apply (you can edit after submission to add more)
      options:
        - All platforms
        - iOS
        - Android
        - Web
        - Other
    validations:
      required: true
      
  - type: textarea
    id: benefits
    attributes:
      label: Benefits
      description: How would this feature benefit you and other users?
      placeholder: Explain the benefits...
    validations:
      required: false
      
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples about the feature request
      placeholder: Any other information that might be helpful...
    validations:
      required: false
